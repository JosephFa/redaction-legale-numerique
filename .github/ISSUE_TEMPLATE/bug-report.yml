name: Bug or Legal Issue
description: Report an incorrect behavior, legal reference, or reliability issue
title: "[Issue]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve French Legal Drafting & Review.

  - type: textarea
    id: problem
    attributes:
      label: Describe the problem
      description: What is incorrect, missing, misleading, or unreliable?
      placeholder: Clearly describe the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the skill do instead?
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example or reproduction
      description: Provide a fictional example or steps to reproduce the issue.
      placeholder: Please do not include personal or confidential data.

  - type: textarea
    id: source
    attributes:
      label: Legal or reference source
      description: If relevant, provide the applicable legal article, CNIL guidance, or other source.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I confirm that I have not included confidential or personal data.
          required: true
